short_bio: >-
  <p>
    I am Zhuoer Shen (沈卓尔, pronounced "Jwo-er Shen"), an M.S. student in Biostatistics at Yale University. 
    Previously, I graduated with honors from the School of Mathematical Sciences at Fudan University in June 2025 with a B.S. in Mathematics and Applied Mathematics. 
    My research interests lie in statistical theory for machine learning, high-dimensional statistics, and generative and reasoning models.
  </p>
  <p>
    During my undergraduate studies at Fudan, I worked on mathematical reasoning in large language models under the supervision of <a href="http://kw.fudan.edu.cn/people/xiaoyanghua/" target="_blank">Prof. Yanghua Xiao</a> and <a href="https://orcid.org/0000-0002-4037-3130" target="_blank">Prof. Zhiqiang Wang</a>. 
    More recently, I have had the opportunity to collaborate with <a href="https://zijungao.github.io/" target="_blank">Prof. Zijun Gao</a> and <a href="https://yaozhang24.github.io/yaozhang.github.io/" target="_blank">Prof. Yao Zhang</a> on generative model evaluation. 
    At Yale, I also completed a project on blind denoising in diffusion models under the guidance of <a href="https://chewisinho.github.io/" target="_blank">Prof. Sinho Chewi</a> and <a href="https://arampooladian.com/" target="_blank">Dr. Aram-Alexandre Pooladian</a>. 
    Since Summer 2026, I have been working with <a href="https://www.weijie-su.com/" target="_blank">Prof. Weijie Su</a> and <a href="https://lx10077.github.io/" target="_blank">Dr. Xiang Li</a> on inference-time reliability in LLMs.
  </p>
  <p>
    <strong>I am currently seeking Fall 2027 Ph.D. positions in Statistics and Theoretical Machine Learning.</strong> 
    Feel free to reach out via email if you would like to discuss research.
  </p>

