short_bio: >-
  <p>
    I am currently an M.S. student in Data Science and Biostatistics at Yale University. 
    Previously, I received my B.S. in Mathematics and Applied Mathematics from Fudan University in 2025.
  </p>
  <p>
    My research interests lie in <strong>theoretical machine learning</strong>, <strong>statistical learning theory</strong>, 
    <strong>high-dimensional statistical inference</strong>, and <strong>stochastic sampling &amp; optimal transport</strong>. 
    I am particularly interested in understanding the mathematical foundations, identifiability, and asymptotic guarantees of modern probabilistic and generative models.
  </p>
  <p>
    <em>I am currently applying for Fall 2027 Ph.D. programs in Statistics and Theoretical Machine Learning.</em>
  </p>

